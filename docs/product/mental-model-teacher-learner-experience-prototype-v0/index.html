 to success are hard to discern. This is an efficient way to transfer complex, tacit knowledge.\n\n• **Most useful when the real question is whose judgment deserves initial weight:** Most useful when teams must decide whether to trust a specialist, escalate to domain expertise, or borrow a proven playbook before reinventing the wheel.\n\n• **Works when deference is explicit rather than invisible:** Works when the group can state which authority it is following, why that person is believable in this domain, and what evidence would justify overriding them.\n\n• **Best when decision speed matters but error checking still exists:** Best when a trusted authority can accelerate triage or direction-setting while the organization still keeps a mechanism for challenge, audit, or second opinion.", "title": "Strengths"}, {"body": "", "title": "Weaknesses and Anti-Patterns"}, {"body": "• **The Wrong Framework Pitfall:** Authority Bias risks falling prey to **Maslow's hammer** (the law of the instrument): \"If all you have is a hammer, everything looks like a nail\". When a problem owner consults experts, the choice of expert implicitly determines the conceptual framework used, potentially blinding the team to other relevant viewpoints and leading to the wrong solution.\n\n• **Illusion of Understanding:** Relying on experts can lead to an **illusion of understanding**. When experts face \"unknown unknowns\" in complex problems, their experience can exacerbate the *What You See Is All There Is (WYSIATI)* tendency, making them overconfident and unwilling to seek further investigation.\n\n• **Stifling Dissent and Groupthink:** In organizational settings, automatically deferring to authority figures suppresses essential feedback. For instance, an executive tasked with implementing a CEO's vision may decide to \"go with the flow\" despite doubts due to political pressure and the phenomenon of **groupthink**.\n\n• **The Curse of Knowledge (Expert Failure to Communicate):** Experts tend to speak abstractly and on a higher level of insight, often overlooking basic details (the Curse of Knowledge). When they distill years of work into common-sense slogans (\"Keep the lines of communication open\"), audiences may accept these \"meaningless\" slogans simply because they came from an expert, failing to gain actionable insight.\n\n• **Danger when credibility is standing in for falsification:** Danger when the team treats rank, polish, or institutional prestige as proof that the recommendation has survived evidence testing, scenario stress, or domain-boundary checks.", "title": "Misapplying or over-relying on Authority Bias can be dangerous, leading to poor outcomes"}, {"body": "Authority Bias interacts with numerous other mental models, operating both as a powerful shortcut and a dangerous cognitive vulnerability.", "title": "The Latticework: Systemic Interactions"}, {"body": "• **WYSIATI (What You See Is All There Is):** Authority Bias is heavily amplified by WYSIATI, the tendency to base judgment solely on the information immediately available. Confidence in an authority's belief depends not on the quantity or quality of evidence, but on the strength of the \"story they can tell about what they see\" (e.g., the presence of the diploma or uniform). This suppresses doubt and ambiguity, settling quickly on a coherent pattern of belief.\n\n• **Anchoring Bias:** The selection of a specific expert or framework can serve as a potent anchor, overly focusing attention on a single piece of information—the authority’s perspective—and rendering alternative views irrelevant.\n\n• **Reciprocity/Liking:** Authority is often intertwined with emotional and social factors. If the authority figure also appeals to the audience's sense of liking (by being friendly or complimentary), the persuasive effect is magnified.", "title": "Allies (Synergistic Relationships)"}, {"body": "• **Idea Meritocracy/Believability Weighting:** These frameworks are designed to directly counter blind deference to authority. They require treating all views in an open-minded way, but placing them in context of the **experiences and track records** (believability) of the person expressing them. Treating all people equally is seen as leading *away* from truth.\n\n• **Radical Open-Mindedness:** The primary antidote to the ego and blind spot barriers (which often manifest as rigid adherence to one's own or one's group's expert beliefs) is **radical open-mindedness**. This mindset compels one to effectively explore different points of view without letting ego or blind spots interfere.\n\n• **Critical Thinking/Skepticism:** Critical thinking demands the \"ability to evaluate evidence, to notice bias as it kicks into gear,\" and to question one's own assumptions. This active inquiry stands against the automatic \"click, run\" nature of Authority Bias. Being fundamentally skeptical about everything is proposed as an essential element of sound problem-solving.\n\n• **First Principles Thinking:** This mental model strips away conventional assumptions and institutional methods that experts might rely on, forcing a problem solver back to the core facts and desired outcome to forge an original solution.", "title": "Antagonists (Conflicting Relationships)"}, {"body": "• **authority-bias vs scientific-method-evidence-testing:** authority-bias conflicts with scientific-method-evidence-testing (scientific method evidence testing) when rank substitutes for falsifiable evidence.\n\n• **authority-bias vs first-principles-thinking:** authority-bias conflicts with first-principles-thinking (first principles thinking) when inherited expert doctrine blocks ground-up decomposition.\n\n• **authority-bias vs confirmation-bias:** authority-bias conflicts with confirmation-bias (confirmation bias) when deference to authority selectively amplifies information that confirms the expert's preferred conclusion.", "title": "Structured Tension Curation (2026-02-27)"}, {"body": "The reliance on Authority Bias poses several systemic risks, primarily driven by the delegation of critical thought.\n\n| Risk/Failure Mode | Description in Context |\n| --- | --- |\n| **Unchallenged Assumptions (Confirmation Bias)** | Authority figures often present proposals that are difficult to challenge because they are associated with high-status proponents or \"sacred beliefs\". Individuals seek information that confirms the authority's idea, risking \"disastrously wrong solutions\". |\n| **Blind Spot Barrier/Motivated Reasoning** | Smart people are particularly susceptible to this risk because they are skilled at constructing compelling narratives to rationalize the expert's conclusion (or their own beliefs), making them less skeptical of ideas that align with their views. |\n| **\"Soft Contracts\" and Low Success Rate** | An employee or junior consultant who is unclear about their contract or assignment with their boss may become unwilling to back away from projects with a low chance of success because they default to pleasing the authority figure. |\n| **Wrong Expert/Domain Dependence** | Accepting advice from an authority figure whose expertise does not transfer to the domain at hand (Domain Dependence) can lead to suboptimal solutions, as the expert will try to solve the problem using only \"their toolkit\". |", "title": "Risks and Mitigations"}, {"body": "To ensure Authority Bias is used wisely—leveraging expertise for efficiency without sacrificing accuracy—structured protocols and a commitment to critical inquiry are necessary:\n\n1. **Enforce Decoupling of Status and Idea:**\n\n◦ **Strategy:** Implement \"group decision hygiene\" by requiring team members to write down initial opinions and rationales *independently* before discussing them, or reading them aloud in reverse order of seniority, to ensure ideas are considered \"on their merits\" rather than according to the status of the proponent.\n\n2. **Challenge the Basis of Authority:**\n\n◦ **Strategy:** Cultivate a mindset that values inquiry and skepticism, recognizing that **\"A way of seeing is also a way of not seeing\"**.\n\n◦ **Pre-mortem Question:** **\"Does the person have the credentials to speak with authority? Which credentials?\"** and **\"What about the person causes you to either trust implicitly or react with initial distrust?\"**.\n\n3. **Insist on the Logic and Rationale:**\n\n◦ **Strategy:** Move beyond accepting the expert's \"Answer\" and instead focus on the **\"How.\"**. When seeking advice from an expert, ask them to provide their **thought chain** and reasoning steps, rather than just the final recommendation.\n\n◦ **Pre-mortem Question:** Ask, **\"What are the underlying assumptions embedded in this framework or solution?\"**. This is crucial because \"A good problem solver makes good assumptions—but most of all, she’s not shy about explaining and sharing them\".\n\n4. **Use Believability Weighting:**\n\n◦ **Strategy:** Consciously \"look down upon yourself and your team\" and consider **who is most likely to be right** based on their \"track records\" and documented expertise in the specific area, not just their rank. If you are less believable, adopt the role of a student with humility until you understand the teacher's perspective.\n\n5. **Simulate and Test Authority Views:**\n\n◦ **Strategy:** Employ techniques like team voting to overcome authority bias or use \"red-team/blue-team competitions\" to explore alternative perspectives and challenge entrenched views. This helps in \"decorrelating errors by obtaining separate judgments on the issue before any discussion\".", "title": "Effective Mitigation Strategies and Pre-mortem Questions"}], "source_bytes": 15462, "source_hash": "7a1b49aadac397eadb58ebe9e51679676f00b136396724787e872bcec8239ad6", "source_href": "../../../data/model_sources/Authority_Bias_rag.md", "source_path": "data/model_sources/Authority_Bias_rag.md", "status": "available"}, "display_name": "Test The Authority, Not The Aura", "href": "../../../data/model_sources/Authority_Bias_rag.md", "model_id": "authority-bias", "roles": ["primary_teaching_lens"], "summary": "When a recommendation depends on authority, make the deference explicit, verify expertise, trustworthiness, domain fit, and track record, then require the authority's reasoning and override evidence so rank or polish accelerates triage without replacing falsification."}, {"appears_in": ["ceo-remove-founding-cofounder"], "boundary": "Inversion is being used as a substitute for execution - identifying what to avoid without subsequently taking positive action leads to paralysis, not progress.", "canonical": {"curation": {"avoid_when": ["Inversion is being used as a substitute for execution — identifying what to avoid without subsequently taking positive action leads to paralysis, not progress.", "The team is generating easily dismissed straw-man failure scenarios rather than genuinely uncomfortable inverse analyses that threaten the preferred plan."], "input_type": "forward-only plan or assumption", "output_type": "failure-path avoidance strategy", "reasoning_types": ["counterfactual", "deductive"], "select_when": ["The cost of a mistake is catastrophic, making the avoidance of stupidity a far more profitable strategy than the pursuit of brilliance.", "The team is planning forward without having mapped the failure landscape — paths to ruin are identifiable even when the path to success is unclear.", "A plan, strategy, or assumption needs stress-testing before committing resources, and stepping from 'how do we win' to 'how do we ensure we don't lose' would limit downside risk.", "First-conclusion bias is locking the team into a favored hypothesis and no one has tried to disprove it from the opposite direction."], "status": "available"}, "intervention": {"failure_modes": [{"confidence": "high", "mitigation": "Pair obstacle removal with positive force augmentation (Lewin): every inverse finding must name both what to avoid and what forward action it unblocks.", "text": "Inversion without action leads to paralysis when teams map the failure landscape exhaustively but never commit to the positive moves required to build something."}, {"confidence": "high", "mitigation": "Use the Dr. Evil Game: imagine you are an evil genius whose sole mission is to sabotage this project — if the team cannot generate uncomfortable answers, the exercise is too shallow.", "text": "Straw-man inverse analysis gives false confidence when easily dismissed failure scenarios substitute for genuinely uncomfortable ones that threaten the preferred plan."}, {"confidence": "high", "mitigation": "Run controlled experiments to see how the system actually breaks in reality; inverse analysis identifies known failure modes, but unknown unknowns require real-world contact.", "text": "The checklist delusion creates false safety when teams identify specific failure modes, implement safeguards, and falsely believe the system is now foolproof — blinding them to unknown unknowns."}, {"confidence": "high", "mitigation": "Apply double-loop learning: question the underlying assumptions and policies that made the failure mode possible, not just the surface action that would trigger it.", "text": "Fundamental attribution error in failure analysis makes teams attribute hypothetical failure to external uncontrollable circumstances rather than internal controllable decisions."}], "heuristics": [{"confidence": "high", "text": "Define the anti-goal first: ask what you don't want to achieve, what causes it, and how to avoid it — the negative formulation often reveals simpler paths than forward planning."}, {"confidence": "high", "text": "Focus on removing obstacles rather than pushing harder on supporting forces — removing friction is frequently more effective and less costly than adding propulsion."}, {"confidence": "high", "text": "Actively seek to disprove your own hypothesis before defending it — invert confirmation bias by asking where the disconfirming evidence lives."}], "premortem_questions": [{"confidence": "high", "text": "If our failure was entirely our own fault — not market conditions, competitors, or bad luck — what internal decision or blind spot destroyed us?"}, {"confidence": "high", "text": "Which of our inverse scenarios, if true, would require us to abandon our current plan entirely — and have we taken that scenario seriously?"}, {"confidence": "high", "text": "What failure mode are we most confident cannot happen — and what would we do if it happened tomorrow?"}], "status": "available"}, "missingness": {"missing_fields": [], "status": "complete_for_prototype"}, "overview": "This briefing document provides a detailed exploration of the Inversion mental model, drawing on principles from mathematics, cognitive science, business strategy, and systems thinking to analyze its mechanics, applications, and interactions with other models in the latticework.\n\n--------------------------------------------------------------------------------\n\nCore Principles and Analogies\n\nThe **fundamental essence** of Inversion is the mental habit of approaching a situation from the opposite end of its natural starting point. Instead of asking how to achieve a desired outcome, inversion demands that you ask what would guarantee failure, and then systematically avoid those things.\n\nCore Definition and Purpose\n\nInversion recognizes that it is often much easier to avoid what you don't want than to attain what you do want. The concept was championed by the 19th-century German mathematician Carl Gustav Jacob Jacobi, who solved complex elliptical functions by following a simple maxim: **\"Man muss immer umkehren\"** (Invert, always invert). Jacobi recognized that in the nature of things, many of the hardest problems are best solved only when addressed backward.\n\nCharlie Munger elevat...", "relation_semantics": {"allies": [{"confidence": "high", "target_model_id": "premortem", "text": "Premortem is a direct procedural application of inversion — it operationalizes backward-from-failure reasoning into a repeatable team exercise that overcomes groupthink."}, {"confidence": "high", "target_model_id": "second-order-thinking", "text": "Second-order-thinking extends inversion's failure tracing beyond the immediate cause to the cascading consequences, giving the inverse analysis depth instead of just surface-level avoidance."}, {"confidence": "high", "target_model_id": "margin-of-safety", "text": "Margin-of-safety completes what inversion starts: inversion identifies the worst-case paths, margin-of-safety builds the buffer to survive them."}, {"confidence": "high", "target_model_id": "first-principles-thinking", "text": "First-principles-thinking and inversion strip away inherited assumptions from opposite directions — first principles builds up from elemental truths while inversion tears down from failure states."}], "antagonists": [{"confidence": "high", "target_model_id": "confirmation-bias", "text": "Confirmation-bias is the ultimate enemy of inversion — it drives the team to seek only evidence that confirms the forward plan, directly blocking the disconfirmation discipline that inversion demands."}, {"confidence": "high", "target_model_id": "optimism-bias-and-planning-fallacy", "text": "Optimism bias and planning fallacy trap decision-makers in narrow project-specific optimism, while inversion forces adoption of the outside view by looking broadly at how similar efforts have failed."}, {"confidence": "high", "target_model_id": "commitment-bias", "text": "Commitment-bias hardens prior commitments into psychological walls that make genuine inversion feel like disloyalty, precisely when backward analysis is most needed."}], "status": "available", "structured_tensions": [{"confidence": "high", "target_model_id": "confirmation-bias", "text": "Inversion conflicts with confirmation-bias when backward analysis is subconsciously constrained to scenarios that still validate the preferred forward plan."}, {"confidence": "high", "target_model_id": "commitment-bias", "text": "Inversion conflicts with commitment-bias when prior public commitment makes genuine failure-mode exploration feel like disloyalty rather than diligence."}, {"confidence": "high", "target_model_id": "optimism-bias-and-planning-fallacy", "text": "Inversion conflicts with optimism-bias-and-planning-fallacy when project-specific optimism overrides the base-rate evidence that inversion surfaces from comparable failures."}]}, "sections": [{"body": "• **inversion vs confirmation-bias:** inversion conflicts with confirmation-bias (confirmation bias) when backward analysis is subconsciously constrained to scenarios that still validate the preferred forward plan.\n\n• **inversion vs commitment-bias:** inversion conflicts with commitment-bias (commitment bias) when prior public commitment makes genuine failure-mode exploration feel like disloyalty rather than diligence.\n\n• **inversion vs optimism-bias-and-planning-fallacy:** inversion conflicts with optimism-bias-and-planning-fallacy (inside view / planning fallacy) when project-specific optimism overrides the base-rate evidence that inversion surfaces from comparable failures.\n\n--------------------------------------------------------------------------------\n\nRisks and Mitigations\n\nThe primary risks of inversion stem from its incomplete nature (it is half the equation) and from the cognitive biases that resist its application even when practitioners intellectually endorse it.\n\nCommon Failure Modes and Cognitive Biases\n\n1. **Illusion of Control and Overoptimism:** The most common blind spot when failing to apply inversion. When humans only plan forward, they fall in love with their own ideas and become blind to disconfirming evidence, assuming their path to success will be friction-free.\n\n2. **The Plunging-In Bias:** Starting to solve a problem before understanding the forces holding the problem in place. Inversion corrects this by insisting you map the failure landscape before designing the solution.\n\n3. **Fundamental Attribution Error in Failure Analysis:** When asking \"how would this fail?\", teams might incorrectly attribute hypothetical failure to external, uncontrollable circumstances rather than looking at internal, controllable inputs — producing an inversion exercise that feels rigorous but avoids accountability.\n\n4. **The Echo Chamber of Negativity:** Over-relying on inversion can breed cynicism or an overly pessimistic culture, where teams become so focused on avoiding failure that they cannot commit to the bold moves required for meaningful progress.\n\nEffective Mitigation Strategies\n\n| Risk | Mitigation Strategy (Counter-Measure) | Pre-Mortem Questions |\n| --- | --- | --- |\n| **Inversion without action (paralysis)** | **Balance inverse with forward execution:** Use inversion to identify and remove obstacles, but pair it with augmenting positive forces (Lewin). Run controlled, limited-downside experiments (MVPs) to test assumptions in the real world rather than theorizing indefinitely about failure. | **\"We have identified what to avoid — what is the single most important positive action we must still take, and by when?\"** |\n| **Straw-man inverse analysis** | **The Dr. Evil Game:** Imagine you are an evil genius whose sole mission is to ensure this project fails. What specific, concrete steps would you take to sabotage it? If the team cannot generate uncomfortable answers, the exercise is too shallow. | **\"If our failure was entirely our own fault — and not due to market conditions, competitors, or bad luck — what internal decision or blind spot destroyed us?\"** |\n| **Checklist delusion (false safety)** | **Test as you fly:** Do no...", "title": "Structured Tension Curation (2026-04-07)"}], "source_bytes": 18980, "source_hash": "2ed573e04cd447125cfd549403caecde672a3caca27bac4cf694e68088693f57", "source_href": "../../../data/model_sources/Inversion_rag.md",   <script>

const data = JSON.parse(document.getElementById("learner-data").textContent);
const state = {
  mode: data.default_mode,
  caseId: data.cases[0].case_id,
  selectedEdgeId: data.cases[0].graph.edges[0].edge_id,
  selectedModelId: data.models[0].model_id,
  query: "",
};

const app = document.getElementById("app");

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function currentCase() {
  return data.cases.find((item) => item.case_id === state.caseId) || data.cases[0];
}

function currentModel() {
  return data.models.find((item) => item.model_id === state.selectedModelId) || data.models[0];
}

function setMode(mode) {
  state.mode = mode;
  render();
}

function setCase(caseId) {
  state.caseId = caseId;
  const selected = currentCase();
  state.selectedEdgeId = selected.graph.edges[0].edge_id;
  render();
}

function openModel(modelId) {
  state.selectedModelId = modelId;
  state.mode = "models";
  render();
}

function openSearchResult(resultId) {
  const result = data.search_index.find((item) => item.id === resultId);
  if (!result) return;
  state.mode = result.mode;
  state.caseId = result.case_id;
  if (result.type === "model") {
    state.selectedModelId = result.id;
  }
  state.query = "";
  const search = document.getElementById("search");
  if (search) search.value = "";
  render();
}

function render() {
  const selected = currentCase();
  app.innerHTML = `
    <header class="topbar">
      <div class="brand">
        <h1>Mental Model Teacher</h1>
        <p>Case anchor -> reasoning move -> model relation -> practice rep</p>
      </div>
      <nav class="mode-tabs" aria-label="Product modes">
        ${data.modes.map((mode) => `
          <button type="button" class="${state.mode === mode.id ? "is-active" : ""}" onclick="setMode('${mode.id}')">${esc(mode.label)}</button>
        `).join("")}
      </nav>
      <div class="search-box">
        <input id="search" type="search" placeholder="Search lessons, models, relations, practice" value="${esc(state.query)}" oninput="onSearchInput(this.value)" autocomplete="off">
        <div id="search-results" class="search-results"></div>
      </div>
    </header>
    <div class="shell-body">
      <aside class="sidebar">
        <h2>Cases</h2>
        <div class="case-list">
          ${data.cases.map((item) => `
            <button type="button" class="case-button ${state.caseId === item.case_id ? "is-active" : ""}" onclick="setCase('${item.case_id}')">
              <span class="case-label">${esc(item.label)}</span>
              <span class="case-move">${esc(item.thinking_move)}</span>
            </button>
          `).join("")}
        </div>
      </aside>
      <main class="main">
        ${renderActiveMode(selected)}
      </main>
    </div>
  `;
  if (state.query) {
    onSearchInput(state.query);
  }
}

function onSearchInput(value) {
  state.query = value;
  const target = document.getElementById("search-results");
  if (!target) return;
  const query = value.trim().toLowerCase();
  if (!query) {
    target.className = "search-results";
    target.innerHTML = "";
    return;
  }
  const results = data.search_index
    .filter((item) => `${item.type} ${item.title} ${item.subtitle}`.toLowerCase().includes(query))
    .slice(0, 10);
  target.className = "search-results is-open";
  target.innerHTML = results.length
    ? results.map((item) => `
      <button type="button" class="search-result" onclick="openSearchResult('${esc(item.id)}')">
        <span class="result-type">${esc(item.type)}</span>
        <span class="result-title">${esc(item.title)}</span>
        <span class="result-subtitle">${esc(item.subtitle)}</span>
      </button>
    `).join("")
    : '<div class="search-result"><span class="result-title">No matching learner objects</span></div>';
}

function renderActiveMode(selected) {
  if (state.mode === "models") return renderModelsMode();
  if (state.mode === "relations") return renderRelationsMode();
  if (state.mode === "map") return renderMapMode(selected);
  if (state.mode === "review") return renderReviewMode(selected);
  return renderLearnMode(selected);
}

function renderLearnMode(selected) {
  return `
    <section class="mode-view is-active">
      <div class="learn-grid">
        <article class="lesson-hero">
          <p class="eyebrow">Learn the move</p>
          <h2>${esc(selected.thinking_move)}</h2>
          <p class="situation">${esc(selected.situation)}</p>
          <div class="story-steps">
            <div class="story-step">
              <h3>The trap</h3>
              <p>${esc(selected.trap)}</p>
            </div>
            <div class="story-step">
              <h3>The move</h3>
              <p>${esc(selected.thinking_move)}</p>
            </div>
            <div class="story-step">
              <h3>Why it helps</h3>
              <p>${esc(selected.why_this_helps)}</p>
            </div>
          </div>
          <div class="relation-strip" role="button" tabindex="0" onclick="setMode('relations')">
            <div class="relation-node">${esc(selected.relation.source_model_label)}</div>
            <div class="relation-type">${esc(selected.relation.relation_type)}</div>
            <div class="relation-node">${esc(selected.relation.target_model_label)}</div>
          </div>
          <div class="practice-box">
            <h3>Practice rep</h3>
            <p><strong>${esc(selected.practice_rep.prompt)}.</strong> ${esc(selected.practice_rep.user_action)}</p>
          </div>
          <div class="boundary-callout">
            ${esc(selected.do_not_overlearn[1] || selected.do_not_overlearn[0])}
          </div>
          ${renderReceipts(selected)}
        </article>
        <aside class="context-column">
          <section class="panel">
            <div class="panel-header"><h3>You are learning</h3></div>
            <div class="panel-body">
              <p><strong>${esc(selected.relation.label)}</strong></p>
              <p>${esc(selected.relation_story)}</p>
              <p><button type="button" onclick="setMode('map')">Open map</button> <button type="button" onclick="setMode('relations')">Open relation</button></p>
            </div>
          </section>
          <section class="panel">
            <div class="panel-header"><h3>Models in this lesson</h3></div>
            <div class="panel-body model-mini-list">
              ${selected.model_stack.map((model) => `
                <div class="model-mini">
                  <h4><button type="button" class="model-link-button" onclick="openModel('${esc(model.model_id)}')">${esc(model.teaching_name)}</button></h4>
                  <p>${esc(model.teaching_note)}</p>
                </div>
              `).join("")}
            </div>
          </section>
        </aside>
      </div>
    </section>
  `;
}

function renderModelsMode() {
  const selectedModel = currentModel();
  return `
    <section class="mode-page">
      <div class="page-head">
        <h2>Models</h2>
        <p>Reusable reasoning lenses. Click a model to open the formatted canonical page, sourced from model Markdown, curation, intervention semantics, and relation semantics.</p>
      </div>
      <div class="model-layout">
        <div class="model-list">
          ${data.models.map((model) => `
            <article class="card ${selectedModel.model_id === model.model_id ? "is-active" : ""}">
              <button type="button" class="card-button" onclick="openModel('${esc(model.model_id)}')">
                <h3>${esc(model.display_name)}</h3>
                <p>${esc(model.summary)}</p>
              </button>
              <div class="card-meta">
                ${model.roles.map((role) => `<span class="chip">${esc(role)}</span>`).join("")}
                ${model.appears_in.map((caseId) => `<button type="button" class="chip" onclick="setCase('${caseId}'); setMode('learn')">Appears in ${esc(caseLabel(caseId))}</button>`).join("")}
              </div>
            </article>
          `).join("")}
        </div>
        ${renderModelDetail(selectedModel)}
      </div>
    </section>
  `;
}

function renderModelDetail(model) {
  const canonical = model.canonical;
  return `
    <article class="model-detail">
      <section class="panel model-detail-hero">
        <p class="eyebrow">Mental model</p>
        <h3>${esc(model.display_name)}</h3>
        <p>${esc(model.summary)}</p>
        <div class="boundary-callout">${esc(model.boundary)}</div>
        <div class="card-meta">
          ${model.roles.map((role) => `<span class="chip">${esc(role)}</span>`).join("")}
          <span class="chip">canonical: ${esc(canonical.status)}</span>
          ${canonical.curation.reasoning_types.map((item) => `<span class="chip">${esc(item)}</span>`).join("")}
        </div>
      </section>
      <section class="panel model-section">
        <h4>Canonical overview</h4>
        <div class="source-block">${renderTextBlock(canonical.overview)}</div>
      </section>
      <section class="section-grid">
        <div class="panel model-section">
          <h4>Use when</h4>
          ${renderTextList(canonical.curation.select_when)}
        </div>
        <div class="panel model-section">
          <h4>Be careful when</h4>
          ${renderTextList(canonical.curation.avoid_when)}
        </div>
      </section>
      <section class="section-grid">
        <div class="panel model-section">
          <h4>Failure modes</h4>
          ${renderFailureModes(canonical.intervention.failure_modes)}
        </div>
        <div class="panel model-section">
          <h4>Premortem questions</h4>
          ${renderTextList(canonical.intervention.premortem_questions.map((item) => item.text))}
        </div>
      </section>
      <section class="panel model-section">
        <h4>Heuristics</h4>
        ${renderTextList(canonical.intervention.heuristics.map((item) => item.text))}
      </section>
      <section class="section-grid">
        <div class="panel model-section">
          <h4>Appears in lessons</h4>
          <div class="card-meta">
            ${model.appears_in.map((caseId) => `<button type="button" class="chip" onclick="setCase('${caseId}'); setMode('learn')">${esc(caseLabel(caseId))}</button>`).join("")}
          </div>
        </div>
        <div class="panel model-section">
          <h4>Connected relations</h4>
          ${renderModelRelations(model)}
        </div>
      </section>
      <section class="panel model-section">
        <h4>Canonical source sections</h4>
        <div class="canonical-sections">
          ${canonical.sections.map((section) => `
            <details>
              <summary>${esc(section.title)}</summary>
              <div class="canonical-text">${renderTextBlock(section.body)}</div>
            </details>
          `).join("")}
        </div>
      </section>
      <section class="panel model-section">
        <h4>Receipts</h4>
        <ul class="receipt-list">
          <li>Canonical source: <a href="${esc(canonical.source_href)}">${esc(canonical.source_path)}</a></li>
          <li>Source hash: <code>${esc(canonical.source_hash)}</code></li>
          <li>Activation curation: ${esc(canonical.curation.status)}</li>
          <li>Intervention semantics: ${esc(canonical.intervention.status)}</li>
          <li>Relation semantics: ${esc(canonical.relation_semantics.status)}</li>
        </ul>
      </section>
    </article>
  `;
}

function renderFailureModes(items) {
  if (!items.length) return '<p class="muted">No source-backed failure modes are present.</p>';
  return `
    <ul class="text-list">
      ${items.map((item) => `
        <li>
          ${esc(item.text)}
          ${item.mitigation ? `<br><span class="muted">Mitigation: ${esc(item.mitigation)}</span>` : ""}
        </li>
      `).join("")}
    </ul>
  `;
}

function renderModelRelations(model) {
  const relations = data.relations.filter((relation) =>
    relation.source_model_id === model.model_id || relation.target_model_id === model.model_id
  );
  const semantic = model.canonical.relation_semantics;
  return `
    ${relations.length ? relations.map((relation) => `
      <p class="source-line"><button type="button" class="model-link-button" onclick="setCase('${relation.used_in[0]}'); setMode('relations')">${esc(relation.display_name)}</button></p>
    `).join("") : '<p class="muted">No pilot relation page uses this model yet.</p>'}
    <details>
      <summary>Canonical relation semantics</summary>
      <h4>Allies</h4>
      ${renderSemanticList(semantic.allies)}
      <h4>Antagonists</h4>
      ${renderSemanticList(semantic.antagonists)}
      <h4>Structured tensions</h4>
      ${renderSemanticList(semantic.structured_tensions)}
    </details>
  `;
}

function renderSemanticList(items) {
  if (!items.length) return '<p class="muted">No source-backed entries in this category.</p>';
  return `
    <ul class="text-list">
      ${items.map((item) => `<li><strong>${esc(item.target_model_id)}</strong>: ${esc(item.text)}</li>`).join("")}
    </ul>
  `;
}

function renderTextList(items) {
  const cleanItems = items.filter(Boolean);
  if (!cleanItems.length) return '<p class="muted">No source-backed entries are present.</p>';
  return `<ul class="text-list">${cleanItems.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`;
}

function renderTextBlock(text) {
  if (!text) return '<p class="muted">No canonical text is present for this section.</p>';
  const paragraphs = String(text)
    .split(/\n{2,}/)
    .map((part) => part.trim())
    .filter(Boolean);
  return paragraphs.map((part) => `<p>${esc(part)}</p>`).join("");
}

function renderRelationsMode() {
  return `
    <section class="mode-page">
      <div class="page-head">
        <h2>Relations</h2>
        <p>Model pairs are first-class teaching objects. The relation story comes before the taxonomy label.</p>
      </div>
      <div class="relation-list">
        ${data.relations.map((relation) => `
          <article class="card">
            <h3><a href="${esc(relation.href)}">${esc(relation.display_name)}</a></h3>
            <p>${esc(relation.story)}</p>
            <div class="card-meta">
              <span class="chip">${esc(relation.relation_type)}</span>
              <span class="chip">confidence: ${esc(relation.confidence)}</span>
              ${relation.used_in.map((caseId) => `<button type="button" class="chip" onclick="setCase('${caseId}'); setMode('learn')">Used in ${esc(caseLabel(caseId))}</button>`).join("")}
              <button type="button" class="chip" onclick="setCase('${relation.used_in[0]}'); setMode('map')">Open in map</button>
            </div>
          </article>
        `).join("")}
      </div>
    </section>
  `;
}

function renderMapMode(selected) {
  const edge = selected.graph.edges[0];
  const relation = selected.relation;
  return `
    <section class="mode-page">
      <div class="page-head">
        <h2>Map</h2>
        <p>A focused lesson neighborhood. Nodes are models; the selected edge opens as a relation, not proof.</p>
      </div>
      <div class="map-layout">
        <div class="map-canvas">
          ${renderGraphSvg(selected)}
        </div>
        <aside class="panel">
          <div class="panel-header"><h3>Selected relation</h3></div>
          <div class="panel-body">
            <p><strong>${esc(edge.label)}</strong></p>
            <p>${esc(selected.relation_story)}</p>
            <p><span class="chip">${esc(edge.relation_type)}</span> <span class="chip">edge is navigation</span></p>
            <p><a href="${esc(relation.href)}">Open relation page</a></p>
            <details>
              <summary>Graph boundary</summary>
              <ul class="boundary-list">
                ${selected.graph.non_claims.map((item) => `<li>${esc(item)}</li>`).join("")}
              </ul>
            </details>
          </div>
        </aside>
      </div>
    </section>
  `;
}

function renderGraphSvg(selected) {
  const nodes = selected.graph.nodes;
  const edge = selected.graph.edges[0];
  const positions = [
    { x: 160, y: 110 },
    { x: 420, y: 250 },
    { x: 680, y: 110 },
  ];
  const positionById = {};
  nodes.forEach((node, index) => {
    positionById[node.node_id] = positions[index] || { x: 160 + index * 180, y: 180 };
  });
  const source = positionById[edge.source_node_id];
  const target = positionById[edge.target_node_id];
  return `
    <svg class="map-svg" viewBox="0 0 840 440" role="img" aria-label="Focused lesson graph">
      <line class="graph-edge is-selected edge-button" x1="${source.x}" y1="${source.y}" x2="${target.x}" y2="${target.y}" onclick="setMode('relations')" />
      <text x="${(source.x + target.x) / 2 - 46}" y="${(source.y + target.y) / 2 - 10}" class="node-label">${esc(edge.relation_type)}</text>
      ${nodes.map((node) => {
        const pos = positionById[node.node_id];
        return `
          <g class="node-button" onclick="openModel('${esc(node.node_id)}')">
            <circle class="graph-node ${node.node_id === selected.graph.default_focus ? "is-selected" : ""}" cx="${pos.x}" cy="${pos.y}" r="52" />
            <text class="node-label" x="${pos.x - 70}" y="${pos.y + 76}">${esc(node.label)}</text>
          </g>
        `;
      }).join("")}
    </svg>
  `;
}

function renderReviewMode(selected) {
  return `
    <section class="mode-page">
      <div class="page-head">
        <h2>Review mode</h2>
        <p>This mode is for source fidelity, missingness, and boundary checks. It is deliberately separate from Learn mode.</p>
      </div>
      <div class="review-layout">
        <article class="panel">
          <div class="panel-header"><h3>Product object under review</h3></div>
          <div class="panel-body">
            <p><strong>${esc(selected.thinking_move)}</strong></p>
            <p>${esc(selected.case_anchor)}</p>
            <div class="review-only boundary-callout">Human review status: ${esc(selected.human_review_status)}. Product proof: false. Runtime integration: false.</div>
            <details open>
              <summary>Missingness</summary>
              <ul class="receipt-list">
                ${selected.missingness.missing_fields.map((item) => `<li>${esc(item)}</li>`).join("")}
              </ul>
            </details>
          </div>
        </article>
        <aside class="panel">
          <div class="panel-header"><h3>Receipts</h3></div>
          <div class="panel-body">
            <ul class="receipt-list">
              ${selected.source_refs.map((ref) => `<li><code>${esc(ref.source_type)}</code>: ${esc(ref.path)}</li>`).join("")}
            </ul>
            <p><a href="${esc(selected.links.lesson_page)}">Rendered lesson page</a></p>
            <p><a href="${esc(selected.links.lesson_object)}">Lesson JSON</a></p>
            <p><a href="${esc(selected.links.graph_object)}">Graph JSON</a></p>
          </div>
        </aside>
      </div>
    </section>
  `;
}

function renderReceipts(selected) {
  return `
    <details>
      <summary>Receipts and boundaries</summary>
      <ul class="receipt-list">
        <li>Human review: ${esc(selected.human_review_status)}</li>
        <li>Product proof: false</li>
        <li>Runtime integration authorized: false</li>
        <li>Missingness: ${esc(selected.missingness.status)}</li>
      </ul>
      <ul class="boundary-list">
        ${selected.non_claims.map((item) => `<li>${esc(item)}</li>`).join("")}
      </ul>
    </details>
  `;
}

function caseLabel(caseId) {
  const item = data.cases.find((candidate) => candidate.case_id === caseId);
  return item ? item.label : caseId;
}

window.setMode = setMode;
window.setCase = setCase;
window.openModel = openModel;
window.onSearchInput = onSearchInput;
window.openSearchResult = openSearchResult;

render();
  </script>
</body>
</html>
